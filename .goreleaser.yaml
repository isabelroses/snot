version: 1

project_name: snot

before:
  hooks:
    - go mod tidy

builds:
  - binary: snot
    main: ./cmd/snot
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X main.Version={{.Version}}
      - -X github.com/isabelroses/snot/internal/xrpc.version={{.Version}}
    goos:
      - linux
      - windows
      - darwin

archives:
  - format: binary
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - typos
